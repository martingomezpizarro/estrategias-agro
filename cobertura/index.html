<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulá tu cobertura · Agro y Mercado</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.png">
<script>
  /* /cobertura/ abre la misma app en modo "solo cobertura", con los mismos parámetros (?a=, ?codigo=). */
  var q = location.search ? "&" + location.search.slice(1) : "";
  location.replace("/?modo=cobertura" + q + location.hash);
</script>
</head>
<body style="font-family:system-ui,sans-serif;padding:24px">
<p><a href="/?modo=cobertura">Abrir el simulador de cobertura</a></p>
</body>
</html>
