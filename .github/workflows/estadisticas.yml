name: Actualizar estadísticas (semanal)
# Pestaña Datos: Secretaría de Agricultura, CME (Yahoo Finance) y USDA PSD.
on:
  schedule:
    - cron: "17 11 * * 1"   # lunes 8:17, hora argentina
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: datos
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bajar estadísticas
        run: python scripts/actualizar_estadisticas.py || echo "ninguna fuente respondió; se conservan los datos anteriores"
      - name: Guardar si cambió
        run: |
          if [ -n "$(git status --porcelain estadisticas.json)" ]; then
            git config user.name "agro-datos[bot]"
            git config user.email "agro-datos@users.noreply.github.com"
            git add estadisticas.json
            git commit -m "Estadísticas semanales: $(TZ=America/Argentina/Buenos_Aires date '+%d/%m/%Y')"
            git pull --rebase
            git push
          fi
