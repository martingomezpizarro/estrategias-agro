name: Actualizar datos de mercado
# Tasas del MAV (apertura, media jornada y cierre), pizarra de Rosario y parámetros, en días hábiles.
on:
  schedule:
    - cron: "0 14 * * 1-5"    # 11:00 hora argentina: apertura
    - cron: "0 17 * * 1-5"    # 14:00: media jornada
    - cron: "15 20 * * 1-5"   # 17:15: cierre
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: datos
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bajar datos
        run: python scripts/actualizar_datos.py || echo "alguna fuente falló; se conservan los datos anteriores"
      - name: Guardar si cambió
        run: |
          if [ -n "$(git status --porcelain datos)" ]; then
            git config user.name "agro-datos[bot]"
            git config user.email "agro-datos@users.noreply.github.com"
            git add datos
            git commit -m "Datos de mercado: $(TZ=America/Argentina/Buenos_Aires date '+%d/%m %H:%M')"
            git pull --rebase && git push
          fi
